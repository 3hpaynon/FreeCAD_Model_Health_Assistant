[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "freecad-model-health-assistant"
version = "0.2.0"
description = "Local-first FreeCAD feature-tree and model-health assistant foundation."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Model Health Assistant contributors" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8"
]
real-ai = [
  "openai==2.45.0",
  "keyring==25.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
